# Cat Sprite Sheet アニメーション設定
# resource/Characters/Cat Sprite Sheet.toml
#
# スプライトシート: 256x320px, 32px グリッド, 8列 x 10行
# start_frame / end_frame は各行 (row) の 0 始まり列インデックス領域を指定します。

display_name = "Cat"
cell_width   = 32
cell_height  = 32

[[clips]]
name        = "Idle"
row         = 0
start_frame = 0
end_frame   = 3
fps         = 6.0
looping     = true

[[clips]]
name        = "Run"
row         = 4
start_frame = 0
end_frame   = 7
fps         = 12.0
looping     = true

[[clips]]
name        = "Jump"
row         = 5
start_frame = 0
end_frame   = 3
fps         = 16.0
looping     = false

[[clips]]
name        = "Fall"
row         = 5
start_frame = 4
end_frame   = 7
fps         = 16.0
looping     = false

[[clips]]
name        = "Attack"
row         = 7
start_frame = 0
end_frame   = 5
fps         = 14.0
looping     = false

[[clips]]
name        = "Hurt"
row         = 6
start_frame = 0
end_frame   = 3
fps         = 30.0
looping     = false
