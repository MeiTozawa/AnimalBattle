# ==============================================================================
# チュートリアル設定ファイル (Tutorial Gameplay Configuration)
# ==============================================================================

[Timing]
TargetCollectDelay = 0.4
MinionDefeatDelay = 0.6
RetryDuration = 1.2
TargetFloatSpeed = 3.5
TargetFloatAmplitude = 5.0
ReachMargin = 32.0

[Texts]
RetryPrompt = "【 RETRY - リトライ 】"
DoorInteractPrompt = "【 [F] 挑戦開始 】"
ControlBoardTitle = "【 基本操作ガイド 】"
ControlBoardMove = "移動　　: A / D"
ControlBoardJump = "二段ジャンプ: SPACE "
ControlBoardDash = "ダッシュ: L-SHIFT"
ControlBoardAttack = "★ 攻撃 : 左クリック (長押し可能)"

# ==============================================================================
# チュートリアル進行フェーズシーケンス (Phases & Steps)
# ==============================================================================

[[Phases]]
Title = "【 A / D : 移動 】"
Subtitle = "左右に順に出現するコインに触れて回収してください"

[[Phases.Steps]]
Subtitle = "左側のコインに触れて回収してください"
Actions = [
    { Type = "SpawnTarget", Pos = { x = 250.0, y = 520.0 }, Radius = 24.0 }
]
Condition = { Type = "CollectTargets" }

[[Phases.Steps]]
Subtitle = "右側のコインに触れて回収してください"
Actions = [
    { Type = "SpawnTarget", Pos = { x = 850.0, y = 520.0 }, Radius = 24.0 }
]
Condition = { Type = "CollectTargets" }

[[Phases]]
Title = "【 SPACE : ジャンプ 】"
Subtitle = "スペースキーで跳躍し、コインを回収してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnTarget", Pos = { x = 420.0, y = 400.0 }, Radius = 28.0 }
]
Condition = { Type = "CollectTargets" }

[[Phases]]
Title = "【 SPACE × 2 : 二段ジャンプ 】"
Subtitle = "空中で再度スペースキーを押し、高所のコインを回収してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnTarget", Pos = { x = 640.0, y = 250.0 }, Radius = 28.0 }
]
Condition = { Type = "CollectTargets" }

[[Phases]]
Title = "【 L-SHIFT : ダッシュ 】"
Subtitle = "足場からジャンプし、空中でダッシュしてリングを通過してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnTarget", Pos = { x = 1100.0, y = 200.0 }, Radius = 34.0 }
]
Condition = { Type = "CollectTargets" }

[[Phases]]
Title = "【 被弾と体力回復 】"
Subtitle = "被弾時はフィールドに出現する回復パックでHPを回復できます"

[[Phases.Steps]]
Subtitle = "被弾を受けました！体力の減少を確認してください"
Actions = [
    { Type = "DamagePlayer", Amount = 1.0 }
]
Condition = { Type = "Timer", Duration = 1.0 }

[[Phases.Steps]]
Subtitle = "出現した回復パックに触れて、HPを回復してください"
Actions = [
    { Type = "SpawnHealthPack", Pos = { x = 640.0, y = 520.0 } }
]
Condition = { Type = "CollectHealthPacks" }

[[Phases]]
Title = "★ 【 左クリック : 攻撃 】 / 【 L-SHIFT : 回避 】"
Subtitle = "マウスで狙いを定め、空中を浮遊するミニオンを撃破してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnMinion", MinionType = "Flying" }
]
Condition = { Type = "DefeatMinions" }

[[Phases]]
Title = "★ 【 左クリック : 攻撃 】 / 【 L-SHIFT : 回避 】"
Subtitle = "マウスで狙いを定め、二体のミニオンを撃破してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnMinion", MinionType = "Ground" },
    { Type = "SpawnMinion", MinionType = "Flying" }
]
Condition = { Type = "DefeatMinions" }

[[Phases]]
Title = "★ 【 右クリック : 特殊能力 】"

[[Phases.Steps]]
SubtitleCat = "右クリックで低速貫通の【 巨型エネルギー弾 】を発射してください"
SubtitleBunny = "右クリックで全画面を切り刻む【 連続斬撃 】を発動してください"
Actions = [
    { Type = "ChargeEnergy", Segments = 1 }
]
Condition = { Type = "UseSpecialAbility", Duration = 0.8 }

[[Phases.Steps]]
SubtitleCat = "巨型エネルギー弾の多段接触で、4体の浮遊ミニオンを一掃してください"
SubtitleBunny = "全画面斬撃の弾幕消去と確定ダメージで、4体の浮遊ミニオンを一掃してください"
Actions = [
    { Type = "ChargeEnergy", Segments = 1 },
    { Type = "SpawnMinion", MinionType = "Flying", Count = 4 }
]
Condition = { Type = "DefeatMinions" }

[[Phases]]
Title = "【 ボス選択 】"
Subtitle = "扉に近づき、[F] キーで挑戦するボスを選択してください"

[[Phases.Steps]]
Actions = [
    { Type = "SpawnDoor", Pos = { x = 290.0, y = 300.0 }, BossType = "BossSnake", TexturePath = "Characters\\031_3.png", Title = "【 蛇神ノ祭壇 】", Tag = "飛行浮遊 ＆ 全方位毒弾幕" },
    { Type = "SpawnDoor", Pos = { x = 990.0, y = 300.0 }, BossType = "BossLion", TexturePath = "Characters\\027_3.png", Title = "【 獅子ノ闘技殿 】", Tag = "突撃重撃 ＆ 地裂衝撃波" }
]
Condition = { Type = "InteractDoor" }
