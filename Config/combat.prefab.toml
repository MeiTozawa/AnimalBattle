Damage = 1.0
FillColor = "#FF0040"
OutlineColor = "#FFFFFF"

[BossMagentaBullet]
Radius = 12.0
Damage = 1.0
FillColor = "#FF00FF"
OutlineColor = "#FFFFFF"

[BossYellowBullet]
Radius = 14.0
Damage = 1.0
FillColor = "#FFFF00"
OutlineColor = "#FFAA00"

[BossYellowSatellite]
MinRadius = 3.0
RadiusMultiplier = 0.55
OrbitDistanceMultiplier = 1.5
Damage = 1.0

[BossBlueBullet]
Radius = 10.0
Damage = 1.0
FillColor = "#00D4FF"
OutlineColor = "#FFFFFF"

[BossBlackBullet]
Radius = 8.0
Damage = 1.2
FillColor = "#202020"
OutlineColor = "#555555"

# --- 近接斬撃判定原型 ---
[PlayerSlashHitbox]
Damage = 3.0
Size = { x = 64.0, y = 64.0 }

# --- 特効演出原型群 ---
[SparkVfx]
