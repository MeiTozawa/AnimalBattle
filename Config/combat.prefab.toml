# ===================================================================
# 戦闘原型設定 (Combat Prefabs Configuration)
# 投射物（弾幕）、近战判定、演出（VFX）の ECS 原型パラメータ
# ===================================================================

# --- 自機通常弾原型 ---
[PlayerBullet]
Shape = "Box"
Size = { x = 12.0, y = 8.0 }
Damage = 1.0

# --- Boss 弾幕原型群 ---
[BossNormalBullet]
